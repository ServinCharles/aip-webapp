name: CI

# Mirrors the Jenkins build pipeline (Jenkinsfile) so every change proves the same commands work.
on:
  push:
  pull_request:
    branches: [main]

env:
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  build:
    name: Build, image and Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and build (same command as Jenkins, in a Node container)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -v "$PWD":/app -w /app node:20-alpine \
            sh -c 'npm ci --no-audit --no-fund && npm run build'
          test -s dist/index.html
      - name: Build image for EKS (linux/amd64)
        run: docker build --platform linux/amd64 -t aip-webapp:ci .
      - name: nginx starts without the chat service, and routes /api/chat when it exists
        run: |
          report() { echo "::error::$1"; docker logs web 2>&1 | grep -iE "emerg|error|warn|resolver|invalid" | head -6 | sed 's/^/::error::nginx: /'; docker exec web cat /etc/nginx/conf.d/default.conf 2>/dev/null | grep -nE "resolver|chat_upstream" | sed 's/^/::error::conf: /' || true; exit 1; }
          docker network create aipnet
          # The web app needs aip-api at start-up (as on Kubernetes); a stand-in is enough here
          docker run -d --name aip-api --network aipnet python:3.12-alpine python -m http.server 8080
          docker run -d --name web --network aipnet -p 8091:8080 aip-webapp:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8091/healthz > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8091/healthz > /dev/null || report "web app did not start"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8091/api/chat -H 'Content-Type: application/json' -d '{"message":"hi"}')
          echo "chat with no chat service: HTTP $code"
          [ "$code" = "502" ] || report "expected 502 with no chat service, got $code"
          docker run -d --name aip-chat-api --network aipnet python:3.12-alpine python -m http.server 8080
          sleep 12   # longer than the resolver's 10s cache, so nginx looks the name up again
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8091/api/chat -H 'Content-Type: application/json' -d '{"message":"hi"}')
          echo "chat routed to stand-in service: HTTP $code"
          [ "$code" = "501" ] || report "expected 501 from the stand-in chat service, got $code"
      - uses: docker/setup-qemu-action@v3
      - name: Build image for Apple Silicon (linux/arm64)
        run: docker buildx build --platform linux/arm64 -t aip-webapp:ci-arm64 .
      - name: Trivy image scan (same gate as Jenkins)
        run: |
          mkdir -p reports
          TRIVY="docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/ -v $PWD/reports:/reports $TRIVY_IMAGE"
          $TRIVY image --no-progress --format json --output /reports/trivy-aip-webapp.json aip-webapp:ci
          $TRIVY image --no-progress --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed aip-webapp:ci
      - name: Summarise vulnerabilities
        if: failure()
        run: |
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL") | select(.FixedVersion != null and .FixedVersion != "") | "::error title=\(.Severity) \(.VulnerabilityID)::\($t): \(.PkgName) \(.InstalledVersion) -> fix \(.FixedVersion)"' reports/*.json | sort -u | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: reports/
