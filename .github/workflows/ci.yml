name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build Docker image
        run: docker build -t aip-webapp:ci .
      - name: Render Kubernetes manifests
        run: kubectl kustomize deploy/k8s > /dev/null
